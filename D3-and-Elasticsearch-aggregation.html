<script type="module">

const ajaxEndpoint = `${indiciaData.esProxyAjaxUrl}/searchbyparams/${indiciaData.nid || 0}`;

const post = new URLSearchParams();

post.set("size", "0");
post.set("track_total_hits", "false");

post.set("bool_queries[0][query_type]", "term");
post.set("bool_queries[0][field]", "taxon.taxon_meaning_id");
post.set("bool_queries[0][value]", "89876");
post.set("bool_queries[0][bool_clause]", "filter");

// Elasticsearch _search API for histogram aggregation
// https://www.elastic.co/docs/reference/aggregations/search-aggregations-bucket-histogram-aggregation
post.set("aggs[months][histogram][field]", "event.month");
post.set("aggs[months][histogram][interval]", "1");
post.set("aggs[months][histogram][min_doc_count]", "0");
post.set("aggs[months][histogram][extended_bounds][min]", "1");
post.set("aggs[months][histogram][extended_bounds][max]", "12");
post.set("aggs[months][histogram][hard_bounds][min]", "1");
post.set("aggs[months][histogram][hard_bounds][max]", "12");

const response = await fetch(ajaxEndpoint, {
    method: "POST",
    credentials: "same-origin",
    headers: {
        "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8",
        Accept: "application/json"
    },
    body: post
});

const result = await response.json();

console.log(result);    // Can view the general structure of Elasticsearch response JSON in browser console,
                        // hits and aggregations are the useful properties in the object

const data = (result.aggregations.months.buckets).map(bucket => ({
    month: bucket.key,
    count: bucket.doc_count
}));

console.log(data)       // Can view the structure of "data" in the console too.

const width = 1080;
const height = 920;
const marginTop = 30;
const marginRight = 0;
const marginBottom = 30;
const marginLeft = 0;

const x = d3
    .scaleBand()
    .domain(data.map((item) => item.month))
    .range([marginLeft, width - marginRight])
    .padding(0.1);

const y = d3
    .scaleLinear()
    .domain([0, Math.max(1, d3.max(data, (item) => item.count) ?? 0)])
    .range([height - marginBottom, marginTop]);

const svg = d3.select("#brc-vis-content") // The BRC Viz module places this div on the page, convenient anchor point
    .append("svg")
        .attr("width", width)
        .attr("height", height)
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("style", "max-width: 100%; height: auto;")
svg
    .append("g")
        .attr("fill", "blue")
        .selectAll("rect")
    .data(data)
    .join("rect")
        .attr("x", (item) => x(item.month) ?? 0)
        .attr("y", (item) => y(item.count))
        .attr("height", (item) => y(0) - y(item.count))
        .attr("width", x.bandwidth())
        .append("title")
        .text((item) => `${item.month}: ${item.count.toLocaleString()}`);
svg
    .append("g")
        .attr("transform", `translate(0,${height - marginBottom})`)
        .call(d3.axisBottom(x).tickSizeOuter(0));
svg
    .append("g")
    .attr("transform", `translate(${marginLeft},0)`)
    .call(d3.axisLeft(y).ticks(5).tickFormat(d3.format("~s")))
    .call((axis) => axis.select(".domain").remove())

</script>
